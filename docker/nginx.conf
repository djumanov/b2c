# Reverse proxy for a real installation. HTTPS is mandatory in every
# environment (API.md §15) — the client supplies the certificate and uncomments
# the TLS block below.

upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Uploaded logos and images can be large; exports larger still.
    client_max_body_size 25m;

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Rate limits fall back to the caller's IP for anonymous requests
        # (API.md §14), so this header has to be right.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A search fans out across providers on the GTS side and is allowed
        # 40 seconds (API.md §12); the proxy must not cut it short.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

